<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clock</title>
</head>
<link rel="stylesheet" href="style.css">
<body>
    
    <div class="namecoderwrapper"><div class="namecoder">SHAIKH AADIL</div></div>
    <div class="clock">
        <div class="display" id="time"></div>
    </div>
    <script>
        setInterval(function(){
            const clock = document.querySelector(".display");
        let time = new Date();
        let sec = time.getSeconds();
        let min = time.getMinutes();
        let hr = time.getHours();
        day = "";
    
        if(hr > 12){
            hr = hr - 12;
        }
        if(hr == 0){
            hr = 12;
        }
        if(sec < 10 ){
            sec = '0' + sec;
        }
        if(min < 10){
            min = '0' + min;
        }
        if(hr < 10){
            hr = '0' + hr;
        if(day <= 12)
        {
            day = 'PM';
        }
        

            
        
        }
        clock.textContent = hr + ':' + min + ':' + sec +  "" + day;
        });
    </script>
</body>
</html>
